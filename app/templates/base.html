<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Audiolibro{% endblock %} · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-icon">◉</span>
      <span>Audiolibro</span>
      <small>v{{ version }}</small>
    </a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if active == 'index' else '' }}">Generar</a>
      <a href="/browser" class="{{ 'active' if active == 'browser' else '' }}">Explorador</a>
      <a href="/jobs" class="{{ 'active' if active == 'jobs' else '' }}">Trabajos</a>
      <a href="/register" class="{{ 'active' if active == 'register' else '' }}">Servicios</a>
    </nav>
    <span class="env-chip {{ 'ok' if ffmpeg else 'warn' }}" title="Dependencia del sistema para conversión de audio">
      ffmpeg {{ '✓' if ffmpeg else '✗' }}
    </span>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Generador de audiolibros desde EPUB/PDF</span>
    <span>Base: <code>{{ settings.base_path }}</code></span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
